        { id: 't5', category: 'travel', phrase: 'Is it within walking distance?', thai: 'เดินไปได้ไหม' },
        { id: 't6', category: 'travel', phrase: "I'd like to check in, please.", thai: 'ขอเช็คอินหน่อยครับ/ค่ะ' },
        { id: 't7', category: 'travel', phrase: 'What time does the museum open?', thai: 'พิพิธภัณฑ์เปิดกี่โมง' },
        { id: 't8', category: 'travel', phrase: 'Could you call a taxi for me?', thai: 'ช่วยเรียกแท็กซี่ให้หน่อยได้ไหม' },
        { id: 't9', category: 'travel', phrase: "I think I'm lost.", thai: 'ฉันคิดว่าฉันหลงทาง' },
        { id: 't10', category: 'travel', phrase: 'Do you accept credit cards?', thai: 'รับบัตรเครดิตไหม' },

      const TABS = [
        {
          key: 'learn',

        {

              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>

      // สถานการณ์สนทนาให้เลือก — AI จะสวมบทบาทตามสถานการณ์ที่เลือก
      const SCENARIOS = [
        {

          emoji: '💬',
          role: 'a friendly English coach having a casual, open-ended conversation',
          opener: "Hi there! I'm Coach Alex. What would you like to talk about today?",
          openerThai: 'สวัสดี! ฉันคือโค้ชอเล็กซ์ วันนี้อยากคุยเรื่องอะไรดี',

          openerThai: 'ยินดีต้อนรับสู่โรงแรมค่ะ มีการจองห้องไว้แล้วใช่ไหมคะ',
        },
        {

          label: 'Shopping',

          emoji: '🛍️',
          role: 'a shop assistant helping the learner find and buy something in a store',
          opener: "Hi! Let me know if you need any help finding something.",
          openerThai: 'สวัสดีค่ะ ถ้าต้องการความช่วยเหลือหาสินค้า บอกได้เลยนะคะ',

      function getScenario(key) {
        return SCENARIOS.find((s) => s.key === key) || SCENARIOS[0];
      }

      // System prompt: AI เป็นทั้งคู่สนทนาและผู้ประเมินทักษะการสื่อสาร
      // ตอบกลับเป็น JSON ที่มีทั้งบทสนทนาต่อและคะแนน/คำแนะนำ (ตามที่ British Council AiBC ทำ)
      // ปรับบทบาทตามสถานการณ์ (scenario) ที่ผู้เรียนเลือก
      function buildSystemPrompt(scenario) {
        return `You are "Coach Alex", a friendly and encouraging AI English speaking coach for Thai learners (beginner to intermediate level).

For this conversation, roleplay as ${scenario.role}. Stay in character while also coaching the learner's English.

The learner's last message may be in English or in Thai:

CASE A — the learner's last message is in English (may contain mistakes):
- Reply with "JSON only". No text outside the JSON. No backticks, no preamble.
- JSON format: {"mode":"score","reply":"A short, natural English reply that continues the roleplay conversation, appropriate to what the learner said and to your role","replyThai":"Thai translation of your reply","scores":{"grammar":0-100,"fluency":0-100,"vocabulary":0-100},"feedback":"A short, encouraging tip in Thai about how to improve the learner's last sentence (grammar, word choice, or naturalness). If the sentence was already great, say so and give one small tip to sound even more natural.","corrected":"If there was a mistake, show the corrected English sentence. If no mistake, leave this empty."}
- Score based on the learner's LAST message only (grammar accuracy, fluency/naturalness of phrasing, vocabulary appropriateness).

CASE B — the learner's last message is in Thai (they want to know how to say it in English):
- Reply with "JSON only". No text outside the JSON. No backticks, no preamble.
- JSON format: {"mode":"translate","englishVersion":"A natural, conversational English translation of what the learner wrote, appropriate to the roleplay context","reply":"A short, natural English reply that continues the roleplay conversation, as if the learner had just said englishVersion to you","replyThai":"Thai translation of your reply"}
- Do NOT include "scores", "feedback", or "corrected" in CASE B — the learner did not write English themselves, so there is nothing of theirs to score.

In both cases, keep "reply" short (1-2 sentences) and conversational, staying in character for the roleplay. Be warm and supportive, never harsh or discouraging.`;
      }

      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = a[i];
          a[i] = a[j];
          a[j] = temp;
        }
        return a;
      }

      function normalizeText(s) {
        return (s || '').toLowerCase().replace(/[.,!?'"]/g, '').replace(/\s+/g, ' ').trim();
      }

      // ตรวจว่าข้อความมีตัวอักษรไทยอยู่หรือไม่ (ใช้แยกโหมด: พิมพ์อังกฤษฝึกพูด vs พิมพ์ไทยขอคำแปล)
      function containsThai(s) {
        return /[\u0E00-\u0E7F]/.test(s || '');
      }

      function SpeakButton({ text, size = 18, onSpeak }) {
        return (
          <button
            type="button"
            onClick={(e) => {

            </svg>
          </button>

      // วงแหวนแสดงคะแนน (radial score ring) — ใช้แทนการ์ดสี่เหลี่ยมแบบเดิม
      function ScoreRing({ label, value, size = 84 }) {
        const stroke = 7;
        const r = (size - stroke) / 2;
        const circumference = 2 * Math.PI * r;
        const offset = circumference - (value / 100) * circumference;
        const color = value >= 80 ? COLORS.mint : value >= 60 ? COLORS.accent : '#C4453B';
        return (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
            <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
              <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={COLORS.line} strokeWidth={stroke} />
              <circle
                cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
                strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round"
                style={{ transition: 'stroke-dashoffset 700ms ease' }}
              />
              <text
                x="50%" y="50%" textAnchor="middle" dy="0.35em"
                transform={`rotate(90 ${size/2} ${size/2})`}
                className="sc-display"
                style={{ fontSize: 20, fontWeight: 700, fill: COLORS.ink }}
              >
                {value}
              </text>
            </svg>
            <div style={{ fontSize: 12.5, color: COLORS.inkSoft, fontWeight: 600 }}>{label}</div>
          </div>
        );
      }

      function SpeakCoach() {
        const [tab, setTab] = useState('chat');
        const [voices, setVoices] = useState([]);

        useEffect(() => {
          if (!('speechSynthesis' in window)) return;
          const updateVoices = () => {
            const availableVoices = window.speechSynthesis.getVoices();
            if (availableVoices.length > 0) setVoices(availableVoices);
          };
          updateVoices();
          window.speechSynthesis.onvoiceschanged = updateVoices;
          return () => { window.speechSynthesis.onvoiceschanged = null; };
        }, []);

        const speak = useCallback((text, rate = 0.95, callback) => {
          if (!('speechSynthesis' in window) || !text) {
            if (typeof callback === 'function') callback();
            return;
          }
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = rate;

          const currentVoices = voices.length > 0 ? voices : window.speechSynthesis.getVoices();
          const en = currentVoices.find((v) => v.lang && v.lang.toLowerCase().startsWith('en'));
          if (en) u.voice = en;

          if (typeof callback === 'function') {
            u.onend = callback;
            u.onerror = callback;
          }
          setTimeout(() => window.speechSynthesis.speak(u), 50);
        }, [voices]);

        return (
          <div style={{
            fontFamily: "'Inter','Noto Sans Thai',sans-serif",
            color: COLORS.ink,
            minHeight: '100vh', width: '100%', boxSizing: 'border-box',
            padding: '28px 16px 56px',
          }}>
            <BrandMark />
            <SegmentedTabs tab={tab} setTab={setTab} />

            <div style={{
              maxWidth: 640, margin: '22px auto 0', background: '#fff',
              borderRadius: 28, padding: '26px 22px',
              boxShadow: '0 20px 50px rgba(74,25,66,0.10)',
            }}>

      // ตราสัญลักษณ์ตรงกลางบนสุด — แทน header แบบชิดซ้ายเดิม

      // แถบแท็บแบบแคปซูลลอยตรงกลาง (segmented control) — แทน sidebar/bottom-nav เดิม

      function LearnTab({ speak }) {

      function SpeakTab({ speak }) {
        const [cat, setCat] = useState('greeting');
        const items = VOCAB.filter((v) => v.category === cat);
        const [idx, setIdx] = useState(0);
        const [micState, setMicState] = useState('idle');
        const [transcript, setTranscript] = useState('');
        const recRef = useRef(null);
        const current = items[idx] || items[0];

        useEffect(() => { setIdx(0); setMicState('idle'); setTranscript(''); }, [cat]);

        function startListening() {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) { setMicState('unsupported'); return; }
          if (recRef.current) { try { recRef.current.abort(); } catch (e) {} }

          try {
            const rec = new SR();
            rec.lang = 'en-US';
            rec.interimResults = false;
            rec.maxAlternatives = 3;
            recRef.current = rec;
            setTranscript('');

            rec.onstart = () => setMicState('listening');

            rec.onresult = (e) => {
              if (!e.results || !e.results[0]) return;
              const alts = Array.from(e.results[0]).map((r) => r.transcript);
              const spokenText = alts[0] || '';
              setTranscript(spokenText);

              const target = normalizeText(current.phrase);
              const hit = alts.some((a) => normalizeText(a) === target);
              setMicState(hit ? 'correct' : 'wrong');
            };

            rec.onerror = (e) => {
              if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                setMicState('denied');
              } else {
                setMicState('wrong');
              }
            };

            rec.onend = () => setMicState((p) => (p === 'listening' ? 'idle' : p));

            rec.start();
          } catch (err) {
            setMicState('unsupported');
          }
        }

        function stopListening() {
          if (recRef.current) recRef.current.stop();
        }

        function next(delta) {
          setMicState('idle'); setTranscript('');
          setIdx((i) => (i + delta + items.length) % items.length);
        }

        if (!current) return null;

        const feedback = {
          idle: { text: 'Tap the mic and try saying this phrase', color: COLORS.inkSoft },
          listening: { text: "Listening... go ahead", color: COLORS.accent },
          correct: { text: 'Great! That sounded right 👏', color: COLORS.mint },
          wrong: { text: `Not quite — try again (heard: "${transcript || '...'}")`, color: COLORS.accent },
          denied: { text: 'Microphone access denied — you can still listen and repeat on your own', color: '#C4453B' },
          unsupported: { text: 'Voice recognition is not supported in this browser', color: '#C4453B' },
        }[micState];

        return (
          <div>
            <CategoryChips value={cat} onChange={setCat} />
            <div style={{
              marginTop: 18, border: `1px solid ${COLORS.line}`, borderRadius: 16,
              background: '#fff', padding: '36px 20px', textAlign: 'center',
            }}>
              <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 10 }}>
                Phrase {idx + 1} of {items.length}
              </div>
              <div className="sc-display" style={{ fontSize: 26, fontWeight: 700, lineHeight: 1.4 }}>{current.phrase}</div>
              <div style={{ fontSize: 15, color: COLORS.inkSoft, marginTop: 6 }}>{current.thai}</div>

              <div style={{ display: 'flex', justifyContent: 'center', gap: 14, marginTop: 24 }}>
                <button type="button" onClick={() => speak(current.phrase)} style={{
                  display: 'flex', alignItems: 'center', gap: 8, padding: '10px 18px',
                  borderRadius: 999, border: `1px solid ${COLORS.line}`, background: COLORS.paper,
                  color: COLORS.ink, fontWeight: 600, fontSize: 14, cursor: 'pointer',
                }}>
                  <span style={{ fontSize: 16 }}>🔊</span> Listen
                </button>
                <button
                  type="button"
                  onClick={micState === 'listening' ? stopListening : startListening}
                  style={{
                    display: 'flex', alignItems: 'center', gap: 8, padding: '10px 18px',
                    borderRadius: 999, border: 'none',
                    background: micState === 'listening' ? '#C4453B' : COLORS.accent,
                    color: '#fff', fontWeight: 600, fontSize: 14, cursor: 'pointer',
                    animation: micState === 'listening' ? 'sc-pulse 1.4s infinite' : 'none',
                  }}
                >
                  {micState === 'listening' ? 'Stop' : 'Repeat'}
                </button>
              </div>

              <div style={{ marginTop: 18, fontSize: 13.5, color: feedback.color, minHeight: 20, fontWeight: 500 }}>
                {feedback.text}
              </div>
            </div>

            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 14 }}>
              <button type="button" onClick={() => next(-1)} style={navBtnStyle}>← Previous</button>
              <button type="button" onClick={() => next(1)} style={navBtnStyle}>Next →</button>
            </div>
          </div>
        );
      }

      const navBtnStyle = {
        padding: '8px 14px', borderRadius: 8, border: `1px solid ${COLORS.line}`,
        background: '#fff', color: COLORS.ink, fontSize: 13.5, fontWeight: 600, cursor: 'pointer',
      };

      function buildQuiz(catKey) {
        const pool = VOCAB.filter((v) => v.category === catKey);
        const qCount = Math.min(8, pool.length);
        return shuffle(pool).slice(0, qCount).map((item) => {
          const distractors = shuffle(pool.filter((v) => v.id !== item.id)).slice(0, 3);
          const options = shuffle([item, ...distractors]);
          return { item, options };
        });
      }

      function QuizTab({ speak }) {
        const [cat, setCat] = useState('greeting');
        const [questions, setQuestions] = useState(() => buildQuiz('greeting'));
        const [qi, setQi] = useState(0);
        const [score, setScore] = useState(0);
        const [selected, setSelected] = useState(null);
        const [done, setDone] = useState(false);

        function restart(newCat) {
          const c = newCat || cat;
          setCat(c);
          setQuestions(buildQuiz(c));
          setQi(0); setScore(0); setSelected(null); setDone(false);
        }

        const q = questions[qi];

        function choose(opt) {
          if (selected) return;
          setSelected(opt.id);
          if (opt.id === q.item.id) setScore((s) => s + 1);
        }

        function nextQuestion() {
          if (qi + 1 >= questions.length) { setDone(true); return; }
          setQi((i) => i + 1);
          setSelected(null);
        }

        if (done) {
          return (
            <div style={{
              border: `1px solid ${COLORS.line}`, borderRadius: 16, background: '#fff',
              padding: '40px 20px', textAlign: 'center',
            }}>
              <div className="sc-display" style={{ fontSize: 22, fontWeight: 700 }}>Quiz complete!</div>
              <div style={{ fontSize: 15, color: COLORS.inkSoft, marginTop: 8 }}>
                Your score: <b style={{ color: COLORS.ink }}>{score} / {questions.length}</b>
              </div>
              <button type="button" onClick={() => restart()} style={{
                marginTop: 20, padding: '10px 20px', borderRadius: 999, border: 'none',
                background: COLORS.accent, color: '#fff', fontWeight: 600, fontSize: 14, cursor: 'pointer',
              }}>
                Try Again
              </button>
            </div>
          );
        }

        if (!q) return null;

        return (
          <div>
            <CategoryChips value={cat} onChange={(c) => restart(c)} />

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '16px 0 10px' }}>
              <span style={{ fontSize: 13, color: COLORS.inkSoft }}>Question {qi + 1} / {questions.length}</span>
              <span style={{ fontSize: 13, color: COLORS.inkSoft }}>Score {score}</span>
            </div>

            <div style={{
              border: `1px solid ${COLORS.line}`, borderRadius: 16, background: '#fff',
              padding: '28px 20px', textAlign: 'center',
            }}>
              <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 12 }}>What does this mean?</div>
              <div className="sc-display" style={{ fontSize: 22, fontWeight: 700, lineHeight: 1.4 }}>{q.item.phrase}</div>
              <div style={{ marginTop: 10 }}>
                <SpeakButton text={q.item.phrase} size={15} onSpeak={speak} />
              </div>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 14 }}>
              {q.options.map((opt) => {
                const isCorrect = opt.id === q.item.id;
                const isChosen = selected === opt.id;
                let bg = '#fff', border = COLORS.line;
                if (selected) {
                  if (isCorrect) { bg = COLORS.mintSoft; border = COLORS.mint; }
                  else if (isChosen) { bg = COLORS.accentSoft; border = COLORS.accent; }
                }
                return (
                  <button
                    type="button"
                    key={opt.id}
                    className="sc-opt"
                    onClick={() => choose(opt)}
                    style={{
                      border: `1.5px solid ${border}`, background: bg, color: COLORS.ink,
                      borderRadius: 10, padding: '14px 10px', fontSize: 14,
                      cursor: selected ? 'default' : 'pointer',
                      animation: selected && (isCorrect || isChosen) ? 'sc-pop 150ms ease' : 'none',
                    }}
                  >
                    {opt.thai}
                  </button>
                );
              })}
            </div>

            {selected && (
              <button type="button" onClick={nextQuestion} style={{
                marginTop: 16, width: '100%', padding: '12px', borderRadius: 10, border: 'none',
                background: COLORS.ink, color: COLORS.paper, fontWeight: 600, fontSize: 14.5, cursor: 'pointer',
              }}>
                {qi + 1 >= questions.length ? 'See Results' : 'Next Question'}
              </button>
            )}
          </div>
        );
      }

      // หน้าเลือกสถานการณ์แบบเต็มหน้า — แสดงก่อนเข้าสู่การสนทนา
      function ScenarioLanding({ onSelect }) {

          <div>

              </div>
              <div style={{ fontSize: 13.5, color: COLORS.inkSoft, marginTop: 6 }}>
                เลือกสถานการณ์ที่อยากฝึกพูด แล้ว AI จะสวมบทบาทคู่สนทนาให้

      // แถบด้านบนของหน้าแชท แสดงสถานการณ์ปัจจุบัน + ปุ่มเปลี่ยนสถานการณ์
      function ScenarioBar({ scenario, onChangeScenario }) {
        return (
          <button
            type="button"
            onClick={onChangeScenario}
            style={{

              </span>
            </span>
            <span style={{ fontSize: 12.5, color: COLORS.accent, fontWeight: 600 }}>Change</span>

      function ChatTab({ speak }) {
        const [scenarioKey, setScenarioKey] = useState(null); // null = ยังไม่เลือกสถานการณ์ → แสดงหน้า landing
        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [micState, setMicState] = useState('idle');
        const [sessionScores, setSessionScores] = useState([]);
        const scrollRef = useRef(null);
        const recRef = useRef(null);

        const scenario = scenarioKey ? getScenario(scenarioKey) : null;

        function startScenario(key) {
          setScenarioKey(key);
          const s = getScenario(key);
          setMessages([{ role: 'assistant', mode: 'score', reply: s.opener, replyThai: s.openerThai, scores: null, feedback: '', corrected: '' }]);
          setSessionScores([]);
          setError('');
        }

        function changeScenario() {
          window.speechSynthesis && window.speechSynthesis.cancel();
          if (recRef.current) { try { recRef.current.abort(); } catch (e) {} }
          setScenarioKey(null);
          setMessages([]);
        }

        const STARTERS = scenarioKey ? ({
          general: ['Hi, how are you today?', 'What do you do for work?', "Let's talk about my weekend."],
          restaurant: ["I'd like to order the grilled salmon.", 'Do you have any vegetarian options?', 'Could I see the menu, please?'],
          airport: ["Here's my passport and ticket.", 'Is my flight on time?', 'Where is gate 12?'],
          interview: ["I'm currently working as a marketing assistant.", 'I have three years of experience in this field.', 'What are the next steps in the process?'],
          hotel: ['Yes, I have a reservation under my name.', 'Could I get a room with a nice view?', 'What time is check-out?'],
          shopping: ["I'm looking for a jacket.", 'Do you have this in a smaller size?', 'How much does this cost?'],
        }[scenarioKey] || []) : [];

        useEffect(() => {
          if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }, [messages, loading]);

        useEffect(() => {
          return () => {
            if (recRef.current) { try { recRef.current.abort(); } catch (e) {} }
            window.speechSynthesis && window.speechSynthesis.cancel();
          };
        }, []);

        // ค่าเฉลี่ยคะแนนตลอดเซสชัน — แสดงความคืบหน้าให้ผู้เรียนเห็นภาพรวม
        const avgScores = sessionScores.length > 0 ? {
          grammar: Math.round(sessionScores.reduce((s, x) => s + x.grammar, 0) / sessionScores.length),
          fluency: Math.round(sessionScores.reduce((s, x) => s + x.fluency, 0) / sessionScores.length),
          vocabulary: Math.round(sessionScores.reduce((s, x) => s + x.vocabulary, 0) / sessionScores.length),
        } : null;

        function sendMessage(text) {
          const trimmed = (text ?? input).trim();
          if (!trimmed || loading || !scenario) return;

          const isThai = containsThai(trimmed);
          // ข้อความไทยยังไม่รู้คำแปลอังกฤษจนกว่า AI จะตอบกลับมา — เก็บ text เดิมไว้แสดงระหว่างรอ
          const userMsg = { role: 'user', text: trimmed, isThai, englishVersion: null };
          const updated = [...messages, userMsg];
          setMessages(updated);
          setInput('');
          setLoading(true);
          setError('');

          const apiMessages = updated.map((m) =>
            m.role === 'user'
              ? { role: 'user', content: m.text }
              : { role: 'assistant', content: JSON.stringify({ reply: m.reply, replyThai: m.replyThai, scores: m.scores, feedback: m.feedback, corrected: m.corrected }) }
          );

          const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';

          fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ messages: apiMessages, systemPrompt: buildSystemPrompt(scenario) }),
          })
            .then((res) => res.json())
            .then((res) => {
              setLoading(false);
              if (res && res.success) {
                try {
                  let raw = res.text.replace(/```json|```/g, '').trim();
                  const parsed = JSON.parse(raw);
                  const mode = parsed.mode === 'translate' ? 'translate' : 'score';

                  // ถ้าเป็นโหมดแปล (ผู้เรียนพิมพ์ไทย) — เติมคำแปลอังกฤษเข้าไปในข้อความของผู้เรียนที่ส่งไปแล้ว
                  if (mode === 'translate' && parsed.englishVersion) {
                    setMessages((prev) => prev.map((m, idx) =>
                      idx === prev.length - 1 && m.role === 'user'
                        ? { ...m, englishVersion: parsed.englishVersion }
                        : m
                    ));
                  }

                  const newMsg = {
                    role: 'assistant',
                    mode,
                    reply: parsed.reply || '',
                    replyThai: parsed.replyThai || '',
                    scores: mode === 'score' ? (parsed.scores || null) : null,
                    feedback: mode === 'score' ? (parsed.feedback || '') : '',
                    corrected: mode === 'score' ? (parsed.corrected || '') : '',
                  };
                  setMessages((prev) => [...prev, newMsg]);
                  if (newMsg.scores) {
                    setSessionScores((prev) => [...prev, newMsg.scores]);
                  }
                  if (newMsg.reply) speak(newMsg.reply);
                } catch (e) {
                  setError('รูปแบบการตอบกลับจาก AI ไม่ถูกต้อง');
                }
              } else {
                setError((res && res.error) || 'เกิดข้อผิดพลาดในการเชื่อมต่อ');
              }
            })
            .catch((err) => {
              setLoading(false);
              setError('เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: ' + err.message);
            });
        }

        function startListening() {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) { setMicState('unsupported'); return; }
          if (recRef.current) { try { recRef.current.abort(); } catch (e) {} }
          window.speechSynthesis && window.speechSynthesis.cancel();

          try {
            const rec = new SR();
            rec.lang = 'en-US';
            rec.interimResults = false;
            rec.maxAlternatives = 3;
            recRef.current = rec;

            rec.onstart = () => setMicState('listening');

            rec.onresult = (e) => {
              if (!e.results || !e.results[0]) return;
              const alts = Array.from(e.results[0]).map((r) => r.transcript);
              const spokenText = (alts[0] || '').trim();
              if (spokenText) sendMessage(spokenText);
            };

            rec.onerror = (e) => {
              if (e.error === 'not-allowed' || e.error === 'service-not-allowed') setMicState('denied');
              else setMicState('idle');
            };

            rec.onend = () => setMicState((p) => (p === 'listening' ? 'idle' : p));

            rec.start();
          } catch (err) {
            setMicState('unsupported');
          }
        }

        function stopListening() {
          if (recRef.current) recRef.current.stop();
        }

        // ยังไม่ได้เลือกสถานการณ์ → แสดงหน้า landing เต็มหน้าก่อน
        if (!scenario) {
          return <ScenarioLanding onSelect={startScenario} />;
        }

        return (
          <div>
            <ScenarioBar scenario={scenario} onChangeScenario={changeScenario} />

            {avgScores && (
              <div style={{
                display: 'flex', justifyContent: 'space-around', alignItems: 'center',
                border: `1px solid ${COLORS.line}`, borderRadius: 16, background: '#fff',
                padding: '18px 10px', marginBottom: 14,
              }}>
                <ScoreRing label="Grammar" value={avgScores.grammar} size={72} />
                <ScoreRing label="Fluency" value={avgScores.fluency} size={72} />
                <ScoreRing label="Vocabulary" value={avgScores.vocabulary} size={72} />
              </div>
            )}

            <div ref={scrollRef} style={{
              border: `1px solid ${COLORS.line}`, borderRadius: 16, background: COLORS.paperDark,
              padding: 16, height: 400, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 12,
            }} className="sc-scroll">
              {messages.map((m, i) => (
                <div key={i} style={{ display: 'flex', justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                  {m.role === 'user' ? (
                    <div style={{ maxWidth: '78%', display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
                      <div style={{
                        background: COLORS.ink, color: COLORS.paper,
                        borderRadius: '14px 14px 2px 14px', padding: '10px 14px', fontSize: 14.5,
                      }}>
                        {m.text}
                      </div>
                      {/* ข้อความไทย: แสดงคำแปลอังกฤษที่ AI แปลให้ (ส่งเข้าสนทนาจริงแล้ว) */}
                      {m.isThai && m.englishVersion && (
                        <div style={{
                          fontSize: 12.5, color: COLORS.accent, background: COLORS.accentSoft,
                          borderRadius: 8, padding: '5px 10px', fontWeight: 500,
                        }}>
                          🗣 "{m.englishVersion}"
                        </div>
                      )}
                      {m.isThai && !m.englishVersion && (
                        <div style={{ fontSize: 12, color: COLORS.inkSoft }}>กำลังแปล...</div>
                      )}
                    </div>
                  ) : (
                    <div style={{
                      maxWidth: '85%', background: '#fff', border: `1px solid ${COLORS.line}`,
                      borderRadius: '14px 14px 14px 2px', padding: '12px 14px',
                    }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span className="sc-display" style={{ fontSize: 15.5, fontWeight: 600 }}>{m.reply}</span>
                        {m.reply && <SpeakButton text={m.reply} size={13} onSpeak={speak} />}
                      </div>
                      {m.replyThai && <div style={{ fontSize: 13, color: COLORS.inkSoft, marginTop: 4 }}>{m.replyThai}</div>}

                      {m.scores && (
                        <div style={{ display: 'flex', gap: 14, marginTop: 10, paddingTop: 10, borderTop: `1px solid ${COLORS.line}` }}>
                          <MiniScore label="Grammar" value={m.scores.grammar} />
                          <MiniScore label="Fluency" value={m.scores.fluency} />
                          <MiniScore label="Vocabulary" value={m.scores.vocabulary} />
                        </div>
                      )}

                      {m.corrected && (
                        <div style={{
                          marginTop: 8, fontSize: 12.5, color: COLORS.ink, background: COLORS.mintSoft,
                          borderRadius: 8, padding: '7px 10px',
                        }}>
                          ✓ Try: <b>{m.corrected}</b>
                        </div>
                      )}

                      {m.feedback && (
                        <div style={{
                          marginTop: 6, fontSize: 12.5, color: '#8A2D5A', background: COLORS.accentSoft,
                          borderRadius: 8, padding: '7px 10px',
                        }}>
                          💡 {m.feedback}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              ))}
              {loading && <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Coach Alex is typing...</div>}
              {error && <div style={{ fontSize: 13, color: '#C4453B' }}>{error}</div>}
            </div>

            {micState === 'denied' && (
              <div style={{ marginTop: 10, fontSize: 12.5, color: '#C4453B' }}>
                Microphone access was denied. Please allow it in your browser settings and try again.
              </div>
            )}
            {micState === 'unsupported' && (
              <div style={{ marginTop: 10, fontSize: 12.5, color: '#C4453B' }}>
                This browser doesn't support voice input. Please type your message instead.
              </div>
            )}

            {messages.length <= 1 && (
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 10 }}>
                {STARTERS.map((s) => (
                  <button type="button" key={s} onClick={() => sendMessage(s)} style={{
                    fontSize: 12.5, padding: '6px 12px', borderRadius: 999,
                    border: `1px solid ${COLORS.line}`, background: '#fff',
                    color: COLORS.ink, cursor: 'pointer',
                  }}>
                    {s}
                  </button>
                ))}
              </div>
            )}

            <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 12, marginBottom: 4 }}>
              พิมพ์อังกฤษเพื่อฝึกและรับคะแนน หรือพิมพ์ไทยเพื่อขอคำแปลเป็นอังกฤษ
            </div>
            <form onSubmit={(e) => { e.preventDefault(); sendMessage(); }} style={{ display: 'flex', gap: 8 }}>
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                placeholder="Type in English or Thai..."
                style={{
                  flex: 1, padding: '10px 14px', borderRadius: 10,
                  border: `1px solid ${COLORS.line}`, background: '#fff',
                  fontSize: 14, outline: 'none', color: COLORS.ink,
                }}
              />
              <button
                type="button"
                onClick={micState === 'listening' ? stopListening : startListening}
                disabled={loading}
                style={{
                  padding: '10px 14px', borderRadius: 10, border: 'none',
                  background: micState === 'listening' ? '#C4453B' : COLORS.accent,
                  color: '#fff', fontWeight: 600, fontSize: 14,
                  cursor: loading ? 'not-allowed' : 'pointer',
                  opacity: loading ? 0.6 : 1,
                  animation: micState === 'listening' ? 'sc-pulse 1.4s infinite' : 'none',
                }}
              >
                {micState === 'listening' ? '■' : '🎙'}
              </button>
              <button
                type="submit"
                disabled={loading}
                style={{
                  padding: '10px 18px', borderRadius: 10, border: 'none',
                  background: COLORS.ink, color: '#fff', fontWeight: 600,
                  fontSize: 14, cursor: loading ? 'not-allowed' : 'pointer',
                  opacity: loading ? 0.7 : 1,
                }}
              >
                Send
              </button>
            </form>
          </div>
        );
      }

      function MiniScore({ label, value }) {
        const color = value >= 80 ? COLORS.mint : value >= 60 ? COLORS.accent : '#C4453B';
        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            <div style={{ fontSize: 11, color: COLORS.inkSoft }}>{label}</div>
            <div className="sc-display" style={{ fontSize: 15, fontWeight: 700, color }}>{value}</div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<SpeakCoach />);
    </script>
  </body>
</html>
