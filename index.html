<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Speaking Pro</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary-accent: #6366F1;
      --secondary-accent: #8B5CF6;
      --user-bubble: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      --ai-bubble: rgba(255, 255, 255, 0.07);
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --glow-color: rgba(99, 102, 241, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-wrapper {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--card-border);
      border-right: 1px solid var(--card-border);
    }

    /* Top Bar Header */
    .top-bar {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.8);
      z-index: 10;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--glow-color);
      font-size: 1.1rem;
    }

    .brand-text h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.3px; }
    .brand-text p { font-size: 0.72rem; color: #10B981; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .online-dot { width: 6px; height: 6px; background: #10B981; border-radius: 50%; display: inline-block; }

    .score-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #A7F3D0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Scenario Selection Scrollbar */
    .scenario-container {
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-behavior: smooth;
      background: rgba(15, 23, 42, 0.4);
      border-bottom: 1px solid var(--card-border);
    }
    .scenario-container::-webkit-scrollbar { display: none; }

    .scenario-btn {
      padding: 8px 16px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scenario-btn.active {
      background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px var(--glow-color);
    }

    /* Chat Body */
    .chat-body {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }

    .chat-row.ai { align-self: flex-start; }
    .chat-row.user { align-self: flex-end; }

    .bubble-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .chat-row.user .bubble-wrapper { flex-direction: row-reverse; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.5;
      position: relative;
    }

    .chat-row.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--card-border);
      border-bottom-left-radius: 4px;
      backdrop-filter: blur(10px);
    }

    .chat-row.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
    }

    .audio-play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .audio-play-btn:active { transform: scale(0.95); background: var(--primary-accent); }

    .translation-sub {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 5px;
      padding: 0 4px;
    }

    .chat-row.user .translation-sub { text-align: right; color: #A5B4FC; }

    /* Dashboard Evaluation Card */
    .eval-card {
      margin: 0 16px 12px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 16px;
      backdrop-filter: blur(15px);
      display: none;
      animation: slideUp 0.3s ease;
    }

    .eval-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .metric-box {
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 4px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric-title { font-size: 0.65rem; color: var(--text-sub); }
    .metric-val { font-size: 0.85rem; font-weight: 700; color: #818CF8; margin-top: 2px; }

    .feedback-note {
      font-size: 0.75rem;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      padding: 8px 12px;
      border-radius: 8px;
    }

    /* Wave recording visualizer */
    .recording-wave {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px;
      background: rgba(220, 38, 38, 0.15);
      border-radius: 20px;
      margin: 0 16px 8px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .wave-bar {
      width: 3px;
      height: 12px;
      background: #EF4444;
      border-radius: 3px;
      animation: wave 1s infinite ease-in-out;
    }

    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; }

    /* Bottom Input Control Bar */
    .input-bar {
      padding: 12px 16px 20px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-box-wrapper {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 25px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
    }

    .text-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 0.9rem;
    }

    .text-input::placeholder { color: var(--text-sub); }

    .mic-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
      border: none;
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px var(--glow-color);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .mic-btn.recording {
      background: linear-gradient(135deg, #EF4444, #DC2626);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
      animation: pulseMic 1.2s infinite;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseMic { 0%{ transform: scale(1); } 50%{ transform: scale(1.08); } 100%{ transform: scale(1); } }
    @keyframes wave { 0%, 100% { height: 6px; } 50% { height: 18px; } }
  </style>
</head>
<body>

<div class="app-wrapper">

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand-title">
      <div class="brand-icon"><i class="fa-solid fa-headset"></i></div>
      <div class="brand-text">
        <h1>AI Speaking Pro</h1>
        <p><span class="online-dot"></span> พร้อมโต้ตอบ Real-time</p>
      </div>
    </div>
    <div class="score-badge" id="scoreBadge"><i class="fa-solid fa-star" style="color:#F59E0B;"></i> <span>--</span></div>
  </header>

  <!-- Scenario Selector -->
  <nav class="scenario-container">
    <button class="scenario-btn active" onclick="selectScenario('🍔 สั่งอาหาร', this)">🍔 สั่งอาหาร</button>
    <button class="scenario-btn" onclick="selectScenario('🏨 โรงแรม', this)">🏨 โรงแรม</button>
    <button class="scenario-btn" onclick="selectScenario('✈️ สนามบิน', this)">✈️ สนามบิน</button>
    <button class="scenario-btn" onclick="selectScenario('💼 สัมภาษณ์งาน', this)">💼 สัมภาษณ์งาน</button>
    <button class="scenario-btn" onclick="selectScenario('💬 ทั่วไป', this)">💬 สนทนาทั่วไป</button>
  </nav>

  <!-- Chat Messages Body -->
  <main class="chat-body" id="chatBody">
    <div class="chat-row ai">
      <div class="bubble-wrapper">
        <div class="bubble">Hello! Ready to practice english with me?</div>
        <button class="audio-play-btn" onclick="speakText('Hello! Ready to practice english with me?')"><i class="fa-solid fa-volume-high"></i></button>
      </div>
      <div class="translation-sub">สวัสดีครับ! พร้อมฝึกภาษาอังกฤษกับผมหรือยังครับ?</div>
    </div>
  </main>

  <!-- Evaluation Card -->
  <section class="eval-card" id="evalCard">
    <div class="feedback-note" id="feedbackNote"><i class="fa-solid fa-bolt" style="color: #F59E0B;"></i> <span>สื่อสารได้ดีมากครับ!</span></div>
    <div class="eval-metrics">
      <div class="metric-box"><div class="metric-title">ออกเสียง</div><div class="metric-val" id="pronVal">0%</div></div>
      <div class="metric-box"><div class="metric-title">ไวยากรณ์</div><div class="metric-val" id="gramVal">0%</div></div>
      <div class="metric-box"><div class="metric-title">คำศัพท์</div><div class="metric-val" id="vocabVal">0%</div></div>
      <div class="metric-box"><div class="metric-title">คล่องแคล่ว</div><div class="metric-val" id="fluencyVal">0%</div></div>
    </div>
  </section>

  <!-- Recording Visualizer Wave -->
  <div class="recording-wave" id="recordingWave">
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <span style="font-size: 0.75rem; color: #EF4444; margin-left: 6px; font-weight: 600;">กำลังฟังเสียงพูดของคุณ...</span>
  </div>

  <!-- Bottom Control Input Bar -->
  <div class="input-bar">
    <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="แตะเพื่อพูด">
      <i class="fa-solid fa-microphone"></i>
    </button>
    <div class="input-box-wrapper">
      <input type="text" id="userInput" class="text-input" placeholder="พิมพ์ข้อความ หรือกดไมค์..." onkeypress="if(event.key==='Enter') handleSend()">
    </div>
    <button class="send-btn" onclick="handleSend()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>

</div>

<script>
  https://script.google.com/macros/s/AKfycbzYr2ENkdCRQnoefg8QlAVjDaPMh7eFJmnautE3jCEPyeV2cJ_ATEL5KjK_7RiaTBeh/exec
  let currentScenario = '🍔 สั่งอาหาร';
  let recognition = null;
  let isRecording = false;

  window.addEventListener('DOMContentLoaded', () => {
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('recordingWave').style.display = 'flex';
      };

      recognition.onresult = (event) => {
        document.getElementById('userInput').value = event.results[0][0].transcript;
        handleSend();
      };

      recognition.onend = recognition.onerror = () => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
        document.getElementById('recordingWave').style.display = 'none';
      };
    }
  });

  function toggleMic() {
    if (!recognition) {
      alert("เบราว์เซอร์ไม่รองรับไมค์ แนะนำให้เปิดด้วย Chrome หรือ Safari ครับ");
      return;
    }
    isRecording ? recognition.stop() : recognition.start();
  }

  function selectScenario(name, element) {
    currentScenario = name;
    document.querySelectorAll('.scenario-btn').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    
    document.getElementById('chatBody').innerHTML = `
      <div class="chat-row ai">
        <div class="bubble-wrapper">
          <div class="bubble">Let's practice: ${name}</div>
          <button class="audio-play-btn" onclick="speakText('Let\\'s practice ${name}')"><i class="fa-solid fa-volume-high"></i></button>
        </div>
        <div class="translation-sub">เริ่มฝึกสถานการณ์: ${name}</div>
      </div>
    `;
    document.getElementById('evalCard').style.display = 'none';
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      window.speechSynthesis.speak(utter);
    }
  }

  function handleSend() {
    const inputEl = document.getElementById('userInput');
    const text = inputEl.value.trim();
    if (!text) return;

    appendUserMsg(text);
    inputEl.value = '';
    appendLoadingMsg();

    google.script.run
      .withSuccessHandler(renderAIResponse)
      .withFailureHandler((err) => {
        removeLoadingMsg();
        alert("การเชื่อมต่อล้มเหลว: " + err);
      })
      .processMessage(currentScenario, text);
  }

  function appendUserMsg(text) {
    const chatBody = document.getElementById('chatBody');
    const safeText = text.replace(/'/g, "\\'");
    chatBody.insertAdjacentHTML('beforeend', `
      <div class="chat-row user">
        <div class="bubble-wrapper">
          <div class="bubble">${text}</div>
          <button class="audio-play-btn" onclick="speakText('${safeText}')"><i class="fa-solid fa-volume-high"></i></button>
        </div>
        <div class="translation-sub" id="latestUserTrans">กำลังแปล...</div>
      </div>
    `);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function appendLoadingMsg() {
    const chatBody = document.getElementById('chatBody');
    chatBody.insertAdjacentHTML('beforeend', `
      <div class="chat-row ai" id="loadingBubble">
        <div class="bubble" style="color: #94A3B8;"><i class="fa-solid fa-circle-notch fa-spin"></i> AI กำลังคิดคำตอบ...</div>
      </div>
    `);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function removeLoadingMsg() {
    const loading = document.getElementById('loadingBubble');
    if (loading) loading.remove();
  }

  function renderAIResponse(data) {
    removeLoadingMsg();

    if (data.error) {
      alert(data.error);
      return;
    }

    const userTransEl = document.getElementById('latestUserTrans');
    if (userTransEl) {
      userTransEl.innerText = `แปล: ${data.userTrans}`;
      userTransEl.removeAttribute('id');
    }

    const chatBody = document.getElementById('chatBody');
    const safeAiReply = data.aiReply.replace(/'/g, "\\'");
    chatBody.insertAdjacentHTML('beforeend', `
      <div class="chat-row ai">
        <div class="bubble-wrapper">
          <div class="bubble">${data.aiReply}</div>
          <button class="audio-play-btn" onclick="speakText('${safeAiReply}')"><i class="fa-solid fa-volume-high"></i></button>
        </div>
        <div class="translation-sub">แปล: ${data.aiReplyThai}</div>
      </div>
    `);
    chatBody.scrollTop = chatBody.scrollHeight;

    // เล่นเสียงตอบกลับของ AI ทันที
    speakText(data.aiReply);

    // อัปเดตการ์ดคะแนน
    document.getElementById('evalCard').style.display = 'block';
    document.getElementById('scoreBadge').querySelector('span').innerText = `${data.scores.total}/100`;
    document.getElementById('pronVal').innerText = `${data.scores.pronunciation}%`;
    document.getElementById('gramVal').innerText = `${data.scores.grammar}%`;
    document.getElementById('vocabVal').innerText = `${data.scores.vocabulary}%`;
    document.getElementById('fluencyVal').innerText = `${data.scores.fluency}%`;
    document.getElementById('feedbackNote').querySelector('span').innerText = data.feedback || 'สื่อสารได้ดีมากครับ!';
  }
</script>

</body>
</html>
